name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the GitHub Release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build per-platform binaries + checksums
        run: |
          set -e
          VERSION=${GITHUB_REF_NAME}
          STAGE="$(mktemp -d)"
          # modernc.org/sqlite is pure-Go → fully static, cross-compile without CGO.
          for tgt in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${tgt%/*}"
            GOARCH="${tgt#*/}"
            ARCHIVE="${STAGE}/transitmonitor_${GOOS}_${GOARCH}.tar.gz"
            echo "Building $ARCHIVE (version=$VERSION)"
            GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${STAGE}/transitmonitor" ./cmd/transitmonitor
            tar -C "$STAGE" -czf "$ARCHIVE" transitmonitor
            rm -f "${STAGE}/transitmonitor"
          done
          # checksums.txt — one "sha256  filename" line per archive (sub2api format,
          # which the in-panel updater's verifyChecksum parses).
          (cd "$STAGE" && sha256sum *.tar.gz) > "${STAGE}/checksums.txt"
          ls -la "$STAGE"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.STAGE }}/transitmonitor_*.tar.gz
            ${{ env.STAGE }}/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
