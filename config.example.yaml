# TransitMonitor sample config.
# Copy to config.yaml and fill in real credentials (protect file: chmod 600).
# Run: ./transitmonitor -config config.yaml           # serve + poll loop
#       ./transitmonitor -config config.yaml -once     # one scrape, print, exit
#       ./transitmonitor -selftest                     # in-process self-test (no real station)
#
# ⚠ ROOT SECRET — TRANSMONITOR_ENCRYPTION_KEY:
# Set this env var to encrypt credentials (API keys, JWTs, notifier secrets) at
# rest in the DB. It is a ROOT SECRET: treat it like a password — persist it in
# docker-compose `environment`, a `.env` file (not committed), or a secret
# manager, and back it up alongside the DB. LOSING IT = stored credentials become
# unreadable forever (no recovery). Stations added via the web UI are encrypted
# with the key in effect at add time; restarting with a different/missing key
# loads them with empty credentials (surfaced as a red "creds decrypt failed"
# badge) until you re-enter credentials or restart with the original key.
# Rotate with: ./transitmonitor -rotate-key -old-key <old> -new-key <new>

db:
  path: transitmonitor.db

timezone: "Asia/Shanghai"   # IANA timezone for dashboard/audit/log timestamps; default Asia/Shanghai

dashboard:
  addr: "127.0.0.1:7421"
  token: ""                # set to require Authorization: Bearer <token> for non-localhost

alerts:
  rules:
    - name: price-up-5pct
      type: delta_pct
      threshold: 5
      enabled: true
    - name: model-removed
      type: model_removed
      enabled: true
    - name: group-ratio-up
      type: group_ratio_delta_pct
      threshold: 10
      enabled: true
    # Fires when a previously-OK endpoint starts returning 401/403 (bad/expired key).
    - name: endpoint-auth-failed
      type: endpoint_auth_failed
      enabled: true
    # Fires after N consecutive scrape failures (threshold = N).
    - name: poll-failure-streak
      type: poll_failure_streak
      threshold: 3
      enabled: true
  dingtalk:
    webhook: ""            # https://oapi.dingtalk.com/robot/send?access_token=...
    secret: ""             # DingTalk signing secret
  webhook:
    url: ""                # generic webhook URL
  lark:
    webhook: ""            # https://open.feishu.cn/open-apis/bot/v2/hook/...
    secret: ""             # 飞书 signing secret (optional)
  slack:
    webhook: ""            # https://hooks.slack.com/services/...
  # QQ 机器人 (官方 Bot OpenAPI v2). 也可在 dashboard /settings 页面在线配置.
  qq:
    app_id: ""             # 机器人在 QQ 开放平台的 AppID
    app_secret: ""         # AppSecret (加密落库于 /settings 保存时)
    group_openid: ""       # 目标群的 group_openid

stations:
  - id: my-relay
    name: My new-api Relay
    base_url: https://relay.example.com
    kind: newapi
    auth:
      pat: ""              # system access token (optional; for /api/user/self/groups, /api/option)
      api_key: "sk-..."    # sk- key (for /v1/* + probe)
      group: default
    poll_interval: 3m
    enabled: true
    probe:
      enabled: false       # set true to send a real tiny chat request
      model: gpt-4o-mini
      max_input_tokens: 8
      max_output_tokens: 1
      max_cost_cents_per_run: 1
      dry_run: true
  - id: my-sub
    name: My sub2api Station
    base_url: https://sub.example.com
    kind: sub2api
    auth:
      api_key: "sk-..."     # for /v1/* + billing
      jwt: ""                # user JWT for /api/v1/channels/available (per-model prices)
      admin_email: ""        # sub2api login email (for auto JWT refresh)
      admin_pass: ""         # sub2api login password (for auto JWT refresh)
      admin_api_key: ""      # admin x-api-key (reserved)
      group: default
    poll_interval: 3m
    enabled: true
    probe:
      enabled: false
      dry_run: true
